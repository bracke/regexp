name = "regexp"
description = "Small bounded regular-expression engine for editor/project-search use"
version = "0.1.0-dev"

authors = ["Bent Bracke"]
maintainers = ["Bent Bracke <bent@bracke.dk>"]
maintainers-logins = ["bracke"]
licenses = "MIT"
website = "https://github.com/bracke/regexp"
long-description = "Regexp is a small bounded regular-expression engine for Ada. It is designed for editor and project-search style workloads where predictable limits matter: compiled patterns have bounded size, matching has a configurable step limit, and the public API is SPARK-compatible."
tags = ["regexp", "search", "match"]

[[depends-on]]
gnat_native = "=15.2.1"

[[actions]]
type = "test"
command = ["sh", "-c", "cd tests && alr build && ./bin/tests"]
