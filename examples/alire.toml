name = "regexp_examples"
description = "Worked examples for the regexp crate"
version = "0.1.0-dev"

authors = ["Bent Bracke"]
maintainers = ["Bent Bracke <bent@bracke.dk>"]
maintainers-logins = ["bracke"]
licenses = "MIT"
website = ""
tags = ["regexp", "examples"]
project-files = ["examples.gpr"]

executables = [
   "basic_search",
   "case_sensitivity",
   "whole_word",
   "find_from_offsets",
   "find_all_matches",
   "matches_entire",
   "character_classes",
   "preset_patterns",
   "lookaround_options",
   "search_workflow",
   "advanced_search_planning",
   "compile_errors",
   "step_limit",
]

[[depends-on]]
gnat_native = "=15.2.1"

[[depends-on]]
regexp = "*"

[[pins]]
regexp = { path = '..' }

# Build dependencies in the development profile (-Og) too, not the default
# release (-O3), so this root and the parent share regexp object files rather
# than forcing each other into full rebuilds.
[build-profiles]
"*" = "development"
