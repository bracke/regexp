name: ci

# Builds regexp, its AUnit suite, and its examples on Linux, macOS and Windows.
# regexp is pure Ada with no sibling dependencies, so each host just builds and
# tests the crate directly.

on:
  push:
  pull_request:
  workflow_dispatch:

# NOTE: GNATprove is deliberately NOT run in CI. regexp's --level=4 proof does not
# finish inside GitHub's job limits (even level 2 on 8 cores does not complete in
# 25 min), so a CI proof gate only ever gets cancelled. The proof remains the LOCAL
# release gate: `tools/check_all` runs `alr exec -- gnatprove -P regexp.gpr --level=4`
# before a release.

jobs:
  build-and-test:
    name: build-and-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      ALIRE_NONINTERACTIVE: "true"
    strategy:
      fail-fast: false
      matrix:
        # An x86_64 macOS image is required: gnat_native=15.2.1 ships no
        # aarch64-darwin binary, so macos-latest (arm64) cannot resolve the pin.
        os: [ubuntu-latest, macos-15-intel, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Alire
        uses: alire-project/setup-alire@v6
        with:
          toolchain: gnat_native=15.2.1 gprbuild

      - name: Raise Alire solver timeout so slow runners get a complete solution
        # Default solver.timeout is 5 s (+10 s grace); a large graph on a slow
        # runner can time out and ship an INCOMPLETE solution, silently dropping
        # transitive crates (then gprbuild fails with "<x>.gpr not found"). Give
        # the solver room to return the complete solution it finds elsewhere.
        shell: bash
        run: alr settings --global --set solver.timeout 600

      - name: Build the library
        # Generates config/regexp_config.gpr, which regexp.gpr withs and which is
        # gitignored (Alire-generated); a raw gprbuild would fail without it.
        shell: bash
        run: alr --non-interactive build
      - name: Build and run the test suite
        # tests is its own Alire root (it depends on aunit), so it builds from there.
        shell: bash
        working-directory: tests
        run: |
          alr --non-interactive build
          # The binary is tests.exe on Windows.
          if [ -f ./bin/tests.exe ]; then
            ./bin/tests.exe
          else
            ./bin/tests
          fi
      - name: Build the examples
        # examples is its own Alire root; its gpr withs config/<crate>_config.gpr,
        # which resolves only inside that crate, so it builds from there.
        shell: bash
        working-directory: examples
        run: alr --non-interactive build
