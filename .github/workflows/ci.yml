name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux-release-check:
    name: Linux release checklist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Alire
        uses: alire-project/setup-alire@v6
        with:
          toolchain: gnat_native=15.2.1 gprbuild
      - name: Build library
        # Generates config/regexp_config.gpr, which regexp.gpr withs and which is
        # gitignored (Alire-generated); a raw gprbuild would fail without it.
        run: alr --non-interactive build
      # NOTE: GNATprove is deliberately NOT run in CI. regexp's --level=4 proof does
      # not finish inside GitHub's 6-hour job limit (even level 2 / 8 cores does not
      # complete in 25 min), so a CI proof gate only ever gets cancelled. The proof
      # remains the LOCAL release gate: `tools/check_all` runs
      # `alr exec -- gnatprove -P regexp.gpr --level=4` before a release.
      - name: Build tests
        # tests is its own Alire root (it depends on aunit), so it builds from there.
        working-directory: tests
        run: alr --non-interactive build
      - name: Run tests
        run: ./tests/bin/tests
      - name: Build examples
        # examples is its own Alire root; its gpr withs config/<crate>_config.gpr,
        # which resolves only inside that crate. Build it there, as tests is built above.
        working-directory: examples
        run: alr --non-interactive build
