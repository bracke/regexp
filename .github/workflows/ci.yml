name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux-release-check:
    name: Linux release checklist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Alire
        uses: alire-project/setup-alire@v5
        with:
          toolchain: gnat_native=15.2.1 gprbuild
      - name: Install GNATprove
        # gnatprove is a regular Alire crate, not a toolchain component; apt has no
        # reliable gnatprove package, which is why the previous job failed at install.
        run: |
          alr install gnatprove
          echo "$HOME/.alire/bin" >> "$GITHUB_PATH"
      - name: Build library
        # Generates config/regexp_config.gpr, which regexp.gpr withs and which is
        # gitignored (Alire-generated); a raw gprbuild would fail without it.
        run: alr --non-interactive build
      - name: Run GNATprove
        # --level=4 is the full proof; -j0 parallelises and --timeout caps each VC
        # so the run terminates instead of hitting the 6-hour job limit. 20s is
        # enough for the provable VCs; unprovable ones no longer burn a full minute.
        run: alr exec -- gnatprove -P regexp.gpr --level=4 -j0 --timeout=20
      - name: Build tests
        # tests is its own Alire root (it depends on aunit), so it builds from there.
        working-directory: tests
        run: alr --non-interactive build
      - name: Run tests
        run: ./tests/bin/tests
      - name: Build examples
        run: alr exec -- gprbuild -P examples/examples.gpr
