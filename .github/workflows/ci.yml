name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux-release-check:
    name: Linux release checklist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Alire
        uses: alire-project/setup-alire@v5
        with:
          toolchain: gnat_native=15.2.1 gprbuild
      - name: Install GNATprove
        # gnatprove is a regular Alire crate, not a toolchain component; apt has no
        # reliable gnatprove package, which is why the previous job failed at install.
        run: |
          alr install gnatprove
          echo "$HOME/.alire/bin" >> "$GITHUB_PATH"
      - name: Build library
        # Generates config/regexp_config.gpr, which regexp.gpr withs and which is
        # gitignored (Alire-generated); a raw gprbuild would fail without it.
        run: alr --non-interactive build
      - name: Run GNATprove
        # Real proof gate: --checks-as-errors=on makes gnatprove exit non-zero on
        # any unproved VC. regexp proves 100% at --level=4, so this passes today and
        # fails only if a future change regresses the proof. -j0 parallelises; the
        # generous --timeout leaves headroom so a slower runner cannot spuriously
        # time out a provable VC (nothing actually reaches the cap).
        run: alr exec -- gnatprove -P regexp.gpr --level=4 -j0 --timeout=60 --checks-as-errors=on
      - name: Build tests
        # tests is its own Alire root (it depends on aunit), so it builds from there.
        working-directory: tests
        run: alr --non-interactive build
      - name: Run tests
        run: ./tests/bin/tests
      - name: Build examples
        run: alr exec -- gprbuild -P examples/examples.gpr
