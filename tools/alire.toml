name = "regexp_tools"
description = "Release checks for the regexp crate"
version = "0.1.0-dev"

authors = ["Bent Bracke"]
maintainers = ["Bent Bracke <bent@bracke.dk>"]
maintainers-logins = ["bracke"]
licenses = "MIT OR Apache-2.0 WITH LLVM-exception"
website = ""
tags = ["regexp", "tooling"]
project-files = ["tools.gpr"]

executables = [
   "check_all",
]

[[depends-on]]
gnat_native = "=15.2.1"

[[depends-on]]
regexp = "*"

[[depends-on]]
project_tools = "*"

[[pins]]
regexp = { path = '..' }
project_tools = { path = '../../project_tools' }

# Build dependencies in the development profile (-Og) too, not the default
# release (-O3), so this root and the parent share regexp object files rather
# than forcing each other into full rebuilds.
[build-profiles]
"*" = "development"
